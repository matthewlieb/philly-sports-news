# 3 tweets per day: morning (historic), midday (article), ~10pm ET (day review)
# Times: 13:00 UTC = 8am ET, 18:00 UTC = 1pm ET, 03:00 UTC = 10pm ET
name: Tweet schedule

on:
  schedule:
    - cron: '0 3,13,18 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Optional: historic | article | day_review (default: auto from UTC hour)'
        required: false
        default: ''

jobs:
  tweet:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push tweeted_urls and slot/hash data after run
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run twitter bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TWEET_SLOT: ${{ inputs.slot }}
        run: python -m twitter_bot.run

      - name: Commit tweeted_urls, slot date, hashes, last_tweeted_team if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add twitter_bot/data/tweeted_urls.txt twitter_bot/data/last_slot_date.txt twitter_bot/data/tweet_hashes.txt twitter_bot/data/last_tweeted_team.txt 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore(bot): update tweet tracking data after scheduled run" && git push)
