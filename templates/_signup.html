{% macro signup(source, heading="Get the brief in your inbox", blurb="The day's Eagles news and what it means, in one email every morning. Plus a quick line on the Sixers, Phillies and Flyers. Free.") %}
{% if newsletter_on %}
<section class="card signup-card">
  <div class="card-body">
    <h2>{{ heading }}</h2>
    <p>{{ blurb }}</p>
    <form class="signup-form" action="/subscribe" method="post">
      <label class="sr-only" for="email-{{ source }}">Email address</label>
      <input id="email-{{ source }}" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      <input type="text" name="website" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
      <input type="hidden" name="source" value="{{ source }}">
      <button type="submit">Sign up</button>
    </form>
    <p class="signup-status" role="status" aria-live="polite"></p>
  </div>
</section>
{% endif %}
{% endmacro %}
